<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Motherboard X-ray blueprint</title>
<desc id="desc">A technical X-ray-style motherboard illustration with glowing circuit traces and labelled CPU socket, RAM slots, storage connector, expansion slot and rear ports.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071b32"/><stop offset="1" stop-color="#020b18"/></linearGradient>
 <linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c3850"/><stop offset=".55" stop-color="#0b293f"/><stop offset="1" stop-color="#104b61"/></linearGradient>
 <linearGradient id="glow" x2="1" y2="0"><stop stop-color="#4cf4ff"/><stop offset="1" stop-color="#6c9cff"/></linearGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2e7193" stroke-width="1" opacity=".35"/></pattern>
 <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6H12M6 0V12" stroke="#4ae6f4" stroke-width=".8" opacity=".22"/></pattern>
</defs>
<rect width="1200" height="760" rx="26" fill="url(#bg)"/><rect width="1200" height="760" rx="26" fill="url(#grid)"/>
