<rect x="215" y="85" width="770" height="585" rx="24" fill="url(#board)" stroke="#61f4ff" stroke-width="4"/>
<rect x="229" y="99" width="742" height="557" rx="17" fill="url(#micro)" stroke="#2aa7ce" stroke-width="2"/>
<g fill="none" stroke="url(#glow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".88" filter="url(#softGlow)">
