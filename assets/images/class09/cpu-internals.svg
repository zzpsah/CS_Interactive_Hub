<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Inside the CPU</title><desc id="desc">Educational diagram of the control unit, arithmetic logic unit and registers connected by internal buses.</desc><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#e9f4ff"/><stop offset="1" stop-color="#c6def7"/></linearGradient></defs><rect width="1100" height="650" rx="28" fill="#f5f9ff"/><rect x="190" y="90" width="720" height="470" rx="26" fill="url(#c)" stroke="#175cd3" stroke-width="5"/><text x="550" y="140" font-family="sans-serif" font-size="34" font-weight="700" fill="#123e87" text-anchor="middle">CPU · CENTRAL PROCESSING UNIT</text><rect x="250" y="190" width="250" height="145" rx="18" fill="#fff" stroke="#175cd3" stroke-width="4"/><text x="375" y="245" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515" text-anchor="middle">Control Unit</text><text x="375" y="282" font-family="sans-serif" font-size="20" fill="#454545" text-anchor="middle">directs operations</text><rect x="600" y="190" width="250" height="145" rx="18" fill="#fff" stroke="#175cd3" stroke-width="4"/><text x="725" y="245" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515" text-anchor="middle">ALU</text><text x="725" y="282" font-family="sans-serif" font-size="20" fill="#454545" text-anchor="middle">arithmetic + logic</text><rect x="390" y="405" width="320" height="95" rx="18" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="550" y="445" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515" text-anchor="middle">Registers</text><text x="550" y="475" font-family="sans-serif" font-size="20" fill="#454545" text-anchor="middle">tiny, fast storage</text><g fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"><path d="M500 260H600"/><path d="M375 335V370H455V405"/><path d="M725 335V370H645V405"/></g><g fill="#0f766e"><path d="M590 248L610 260L590 272Z