name: Validate and publish learning website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate student pages
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          for f in class09/index.html class10/index.html class11/index.html class12/index.html class09/ch01_hardware_memory.html class10/ch01_networks_web.html class11/ch01_number_systems.html class12/ch01_python_functions.html; do test -s "$f" || exit 1; done
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','class09/ch01_hardware_memory.html','class10/ch01_networks_web.html','class11/ch01_number_systems.html','class12/ch01_python_functions.html']:
              s=Path(name).read_text(encoding='utf-8')
              assert '<!doctype html>' in s.lower(), name
              assert 'lang-hi' in s, name
              assert 'data-quiz' in s, name
              print('OK', name)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
