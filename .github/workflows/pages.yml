name: Validate and publish learning website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate student pages
        run: |
          test -s index.html
          test -s favicon.svg
          test -s assets/css/style.css
          test -s assets/js/app.js
          for f in class08/index.html class09/index.html class10/index.html class10/ch02_digital_safety.html class10/ch03_html_basics.html class10/ch04_html_media_links.html class10/ch05_html_tables.html class10/ch06_html_forms.html class10/ch07_css_styling.html class10/ch08_practical_project.html class11/index.html class12/index.html class09/ch01_introduction_ict.html class09/ch02_textual_communication.html class09/ch03_visual_communication.html class09/ch04_audio_video_communication.html class09/ch05_presenting_ideas.html class09/ch06_getting_connected_internet.html class09/ch07_cyber_safety.html class09/ch08_fun_with_logic.html class10/ch01_networks_web.html class11/ch01_number_systems.html class12/ch01_python_functions.html; do test -s "$f" || exit 1; done
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [
              'index.html',
              'class08/index.html',
              'class09/index.html',
              'class09/ch01_introduction_ict.html',
              'class09/ch02_textual_communication.html',
              'class09/ch03_visual_communication.html',
              'class09/ch04_audio_video_communication.html',
              'class09/ch05_presenting_ideas.html',
              'class09/ch06_getting_connected_internet.html',
              'class09/ch07_cyber_safety.html',
              'class09/ch08_fun_with_logic.html',
              'class10/index.html',
              'class10/ch01_networks_web.html',
              'class10/ch02_digital_safety.html',
              'class10/ch03_html_basics.html',
              'class10/ch04_html_media_links.html',
              'class10/ch05_html_tables.html',
              'class10/ch06_html_forms.html',
              'class10/ch07_css_styling.html',
              'class10/ch08_practical_project.html',
              'class11/index.html',
              'class11/ch01_number_systems.html',
              'class12/index.html',
              'class12/ch01_python_functions.html',
          ]
          for name in pages:
              s = Path(name).read_text(encoding='utf-8')
              assert '<!doctype html>' in s.lower(), f'{name}: missing doctype'
              if name == 'index.html' or name.startswith('class08/') or name.startswith('class09/') or name.startswith('class10/'):
                  assert 'lang-hi' in s, f'{name}: missing bilingual text'
              assert 'assets/css/style.css' in s, f'{name}: missing shared stylesheet'
              assert 'assets/js/app.js' in s, f'{name}: missing shared language script'
              if name != 'index.html':
                  assert 'data-lang-toggle' in s, f'{name}: missing language toggle'
              if name.startswith('class09/ch') and name.endswith('.html'):
                  has_study_copy = 'id="study-copy"' in s and 'Study &amp; Copy' in s
                  has_legacy_study_section = 'id="notes"' in s
                  assert has_study_copy or has_legacy_study_section, f'{name}: missing Study & Copy section'
                  assert ('Questions &amp; Answers' in s or 'Questions and Answers' in s or 'questions-answers' in s or 'Check your understanding' in s), f'{name}: missing question-answer content'
                  assert not re.search(r'\bexam(?:[- ]?(?:ready|notes|practice|tip))?\b', s, re.I), f'{name}: exam-focused wording should not appear in student pages'
              print('OK', name)
          PY
      - name: Validate Class IX local links, anchors and unique IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  for key in ('href','src'):
                      if attrs.get(key): self.refs.append(attrs[key])
          pages={}
          for folder in ('class09','class10'):
              for path in Path(folder).glob('*.html'):
                  page=Page(); page.feed(path.read_text(encoding='utf-8'))
                  duplicates=sorted({item for item in page.ids if page.ids.count(item)>1})
                  assert not duplicates, f'{path}: duplicate IDs: {duplicates}'
                  pages[path.resolve()]=page
          errors=[]
          for source,page in pages.items():
              for ref in page.refs:
                  url=urlsplit(ref)
                  if url.scheme or url.netloc or not url.path: continue
                  target=(source.parent/unquote(url.path)).resolve()
                  if not target.exists():
                      errors.append(f'{source}: missing local target {ref}'); continue
                  if url.fragment and target.suffix.lower()=='.html':
                      target_page=pages.get(target)
                      if target_page is None:
                          target_page=Page(); target_page.feed(target.read_text(encoding='utf-8'))
                      if unquote(url.fragment) not in target_page.ids:
                          errors.append(f'{source}: missing fragment {ref}')
          assert not errors, '\n'.join(errors)
          print(f'Validated {len(pages)} Class IX/X HTML files: local links, anchors and IDs are sound.')
          PY
      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check inline JavaScript in Class IX lessons
        run: |
          python - <<'PYINLINE'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.current=None; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      attrs=dict(attrs)
                      self.current=None if 'src' in attrs else []
              def handle_data(self, data):
                  if self.current is not None: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.current is not None:
                      code=''.join(self.current).strip()
                      if code: self.scripts.append(code)
                      self.current=None
          checked=0
          with tempfile.TemporaryDirectory() as tmp:
              for folder in ('class09','class10'):
                  for page in Path(folder).glob('*.html'):
                      parser=Scripts(); parser.feed(page.read_text(encoding='utf-8'))
                      for i, code in enumerate(parser.scripts):
                          path=Path(tmp)/f'{page.parent.name}-{page.stem}-{i}.js'
                          path.write_text(code, encoding='utf-8')
                          subprocess.run(['node','--check',str(path)],check=True)
                          checked += 1
          print(f'Validated {checked} inline scripts across Class IX and X pages.')
          PYINLINE
      - name: Validate Class IX model-answer language parity
        run: |
          python - <<'PYLANG'
          from pathlib import Path
          import re
          pages = [
              'class09/ch01_part1_ict_basics.html',
              'class09/ch01_part2_computer_workflow.html',
              'class09/ch01_part3_inside_computer.html',
              'class09/ch01_part4_ict_practical_lab.html',
              'class09/ch02_textual_communication.html',
              'class09/ch03_visual_communication.html',
              'class09/ch04_audio_video_communication.html',
              'class09/ch05_presenting_ideas.html',
              'class09/ch06_getting_connected_internet.html',
              'class09/ch07_cyber_safety.html',
              'class09/ch08_fun_with_logic.html',
          ]
          total = 0
          for name in pages:
              html = Path(name).read_text(encoding='utf-8')
              answers = re.findall(r'<div class="model-answer">([\s\S]*?)</div>', html)
              assert len(answers) == 5, f'{name}: expected 5 model answers, found {len(answers)}'
              missing = [i + 1 for i, answer in enumerate(answers) if 'lang-hi' not in answer and 'lang="hi"' not in answer]
              assert not missing, f'{name}: model answers missing Hindi: {missing}'
              total += len(answers)
          print(f'Validated Hindi equivalents for all {total} model answers across {len(pages)} Class IX lessons.')
          PYLANG
      - name: Validate interactive story mount points
        run: |
          python - <<'PYHOOKS'
          from pathlib import Path
          from html.parser import HTMLParser
          class Hooks(HTMLParser):
              def __init__(self):
                  super().__init__(); self.data=set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key.startswith('data-'): self.data.add(key)
          expected = {
              'class09/ch01_part1_ict_basics.html': {'data-ict-story','data-ict-count','data-ict-options','data-ict-next'},
              'class09/ch06_getting_connected_internet.html': {'data-internet-journey','data-ij-count','data-ij-next','data-ij-options'},
              'class09/ch08_fun_with_logic.html': {'data-logic-mission','data-lm-count','data-lm-options','data-lm-next','data-lt-run','data-lt-download','data-lt-print'},
          }
          for name, required in expected.items():
              parser=Hooks(); parser.feed(Path(name).read_text(encoding='utf-8'))
              missing=sorted(required-parser.data)
              assert not missing, f'{name}: missing interactive hooks: {missing}'
              print('OK', name)
          PYHOOKS
      - name: Validate Class X HTML media lab controls
        run: |
          python - <<'PYX'
          from pathlib import Path
          from html.parser import HTMLParser
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set()
              def handle_starttag(self, tag, attrs):
                  value=dict(attrs).get('id')
                  if value: self.ids.add(value)
          required={'hm-title','hm-copy','hm-face','hm-size','hm-color','hm-image','hm-alt','hm-link','hm-linktext','hm-math','hm-audio','hm-video','hm-download','hm-reset','hm-preview','hm-source','hm-status'}
          page=IDs(); page.feed(Path('class10/ch04_html_media_links.html').read_text(encoding='utf-8'))
          missing=sorted(required-page.ids)
          assert not missing, f'Class X HTML media lab missing controls: {missing}'
          assert 'sandbox=""' in Path('class10/ch04_html_media_links.html').read_text(encoding='utf-8'), 'HTML preview must remain sandboxed'
          assert 'function documentFor(content)' in Path('class10/ch04_html_media_links.html').read_text(encoding='utf-8'), 'Export must use standalone media file names rather than temporary preview blob URLs'
          print('Class X HTML media lab controls and sandbox verified.')
          PYX
      - name: Validate Class X HTML table builder
        run: |
          python - <<'PYTABLE'
          from pathlib import Path
          from html.parser import HTMLParser
          required={'tb-cells','tb-head','tb-merge','tb-download','tb-reset','tb-status','tb-preview','tb-source'}
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set()
              def handle_starttag(self, tag, attrs):
                  value=dict(attrs).get('id')
                  if value: self.ids.add(value)
          html=Path('class10/ch05_html_tables.html').read_text(encoding='utf-8')
          parser=IDs(); parser.feed(html)
          missing=sorted(required-parser.ids)
          assert not missing, f'Class X table builder missing controls: {missing}'
          assert 'function esc(s)' in html and 'preview.innerHTML=table' in html, 'Table cell content must be escaped before preview rendering'
          print('Class X table builder controls and escaping verified.')
          PYTABLE
      - name: Validate Class X HTML form practice
        run: |
          python - <<'PYFORM'
          from pathlib import Path
          from html.parser import HTMLParser
          required={'form-practice','fp-name','fp-email','fp-password','fp-class','fp-note','fp-status','fp-result','fp-download'}
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set()
              def handle_starttag(self, tag, attrs):
                  value=dict(attrs).get('id')
                  if value: self.ids.add(value)
          html=Path('class10/ch06_html_forms.html').read_text(encoding='utf-8')
          parser=IDs(); parser.feed(html)
          missing=sorted(required-parser.ids)
          assert not missing, f'Class X form practice missing controls: {missing}'
          assert 'autocomplete="off"' in html and 'password and personal fields are not shown' in html, 'Form practice must protect entered values'
          print('Class X local-only form practice controls and privacy checks verified.')
          PYFORM
      - name: Validate Class X CSS practice controls
        run: |
          python - <<'PYCSS'
          from pathlib import Path
          from html.parser import HTMLParser
          required={'cs-color','cs-bg','cs-border','cs-outline','cs-width','cs-height','cs-margin','cs-font','cs-align','cs-float','cs-demo','cs-source','cs-download','cs-reset'}
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set()
              def handle_starttag(self, tag, attrs):
                  value=dict(attrs).get('id')
                  if value: self.ids.add(value)
          html=Path('class10/ch07_css_styling.html').read_text(encoding='utf-8')
          parser=IDs(); parser.feed(html)
          missing=sorted(required-parser.ids)
          assert not missing, f'Class X CSS lab missing controls: {missing}'
          assert 'prefers-reduced-motion' in Path('assets/css/style.css').read_text(encoding='utf-8'), 'Shared stylesheet should provide reduced-motion support'
          print('Class X CSS practice controls verified.')
          PYCSS
      - name: Validate Class X 10-page project generator
        run: |
          python - <<'PYPROJECT'
          from pathlib import Path
          html=Path('class10/ch08_practical_project.html').read_text(encoding='utf-8')
          for name in ('index.html','about.html','activities.html','timetable.html','gallery.html','resources.html','team.html','contact.html','feedback.html','references.html'):
              assert "['"+name+"'" in html, f'Project generator missing {name}'
          assert 'application/zip' in html and 'function crc32' in html and 'function zip(files)' in html, 'Project ZIP generator is incomplete'
          assert 'u16(0),u32(0),u32(offset)' in html, 'ZIP central directory offsets must be written in the correct fields'
          assert 'sandbox=""' in html, 'Project preview must remain sandboxed'
          assert html.count('data-lab-task') >= 13 and 'lab-task-download' in html, 'Practical lab checklist/log is incomplete'
          for term in ('sandbox', 'antivirus', 'plagiarism', 'frame', 'graphical elements'):
              assert term.lower() in html.lower(), f'Practical exercise missing: {term}'
          print('Class X ten-page HTML project generator verified.')
          PYPROJECT
      - name: Validate Class X networking interactive labs
        run: |
          python - <<'PYNETLAB'
          from pathlib import Path
          html=Path('class10/ch01_networks_web.html').read_text(encoding='utf-8')
          for token in ('data-protocol-lab','data-protocol-check','data-protocol-next','data-service-lab','data-service-check','hiPrompt','SMTP','POP3','HTTPS','SFTP','SCP'):
              assert token in html, f'Networking lab missing {token}'
          assert 'aria-live="polite"' in html, 'Networking lab feedback must be announced accessibly'
          print('Class X networking protocol and Internet-service labs verified.')
          PYNETLAB
      - name: Validate Class X cyber ethics decision lab
        run: |
          python - <<'PYETHICS'
          from pathlib import Path
          html=Path('class10/ch02_digital_safety.html').read_text(encoding='utf-8')
          assert html.count('class="interactive ethics-case" data-ethics-case') == 4, 'Expected four ethics decision cases'
          for token in ('license','credit','verify','access','data-ethics-check','aria-live="polite"'):
              assert token in html, f'Ethics decision lab missing {token}'
          print('Class X four-case digital ethics decision lab verified.')
          PYETHICS
      - name: Audit Class X theory against the official 2026–27 syllabus
        run: |
          python - <<'PYSYLLABUS'
          from pathlib import Path
          from html.parser import HTMLParser
          from html import unescape
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.en=0; self.hi=0
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs); classes=attrs.get('class','').split()
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if 'lang-en' in classes: self.en += 1
                  if 'lang-hi' in classes or attrs.get('lang') == 'hi': self.hi += 1
          checks = {
              'class10/ch01_networks_web.html': [
                  'web client','web server','blog','newsgroup','html','web address',
                  'e-mail address','downloading','uploading','tcp/ip','smtp','pop3',
                  'http','https','ssh','sftp','ftp','scp','telnet','information retrieval',
                  'search engines','finding people','e-learning','e-banking','eshopping',
                  'e-reservation','e-governance','e-groups','social networking',
                  'sms','mms','3g','4g','5g'
              ],
              'class10/ch02_digital_safety.html': [
                  'netiquette','software licence','open-source software movement',
                  'intellectual property rights','plagiarism','digital property rights',
                  'freedom of information','digital divide','e-commerce','privacy',
                  'fraud','secure data transmission'
              ],
              'class10/ch03_html_basics.html': [
                  '<html>','<head>','<title>','<body>','bgcolor','text','link',
                  'background','vlink','alink','<br>','<hr>','comment','<h1>','<h6>','<p>',
                  '<b>','<i>','<u>','<ul>','<ol>','<li>','<dl>','<dt>','<dd>',
                  'start','type'
              ],
              'class10/ch04_html_media_links.html': [
                  'face','size','color','<img','src','width','height','alt',
                  '<sup>','<sub>','mailto','target','audio','video'
              ],
              'class10/ch07_css_styling.html': [
                  'color','background-color','border-style','margin','height',
                  'width','outline','font-family','font-style','font-size',
                  'text-align','float'
              ],
          }
          for name, terms in checks.items():
              html=Path(name).read_text(encoding='utf-8')
              parser=Page(); parser.feed(html)
              lower=unescape(html).lower()
              missing=[term for term in terms if term.lower() not in lower]
              assert not missing, f'{name}: syllabus terms missing: {missing}'
              assert len(parser.ids)==len(set(parser.ids)), f'{name}: duplicate IDs'
              assert parser.en and parser.hi, f'{name}: bilingual content missing'
              print(f'OK {name}: {len(terms)} syllabus terms; EN={parser.en}, HI={parser.hi}')
          PYSYLLABUS
      - uses: actions/configure-pages@v6
      - name: Download official Bihar Gazette PDF for offline hosting
        run: |
          mkdir -p assets/docs
          curl --fail --location --retry 3 --retry-delay 2 https://egazette.bihar.gov.in/GazettePrinting/GazettePublished/274_2_2024.pdf --output assets/docs/bihar-gazette-notification-786-gazette-274-2024.pdf
          test "$(head -c 5 assets/docs/bihar-gazette-notification-786-gazette-274-2024.pdf)" = "%PDF-"
          test "$(stat -c%s assets/docs/bihar-gazette-notification-786-gazette-274-2024.pdf)" -gt 10000
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
