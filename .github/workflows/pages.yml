name: Validate and publish learning website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate student pages
        run: |
          test -s index.html
          test -s favicon.svg
          test -s assets/css/style.css
          test -s assets/js/app.js
          for f in class08/index.html class09/index.html class10/index.html class11/index.html class12/index.html class09/ch01_introduction_ict.html class09/ch02_textual_communication.html class09/ch03_visual_communication.html class09/ch04_audio_video_communication.html class09/ch05_presenting_ideas.html class09/ch06_getting_connected_internet.html class09/ch07_cyber_safety.html class09/ch08_fun_with_logic.html class10/ch01_networks_web.html class11/ch01_number_systems.html class12/ch01_python_functions.html; do test -s "$f" || exit 1; done
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [
              'index.html',
              'class08/index.html',
              'class09/index.html',
              'class09/ch01_introduction_ict.html',
              'class09/ch02_textual_communication.html',
              'class09/ch03_visual_communication.html',
              'class09/ch04_audio_video_communication.html',
              'class09/ch05_presenting_ideas.html',
              'class09/ch06_getting_connected_internet.html',
              'class09/ch07_cyber_safety.html',
              'class09/ch08_fun_with_logic.html',
              'class10/index.html',
              'class10/ch01_networks_web.html',
              'class11/index.html',
              'class11/ch01_number_systems.html',
              'class12/index.html',
              'class12/ch01_python_functions.html',
          ]
          for name in pages:
              s = Path(name).read_text(encoding='utf-8')
              assert '<!doctype html>' in s.lower(), f'{name}: missing doctype'
              if name == 'index.html' or name.startswith('class08/') or name.startswith('class09/'):
                  assert 'lang-hi' in s, f'{name}: missing bilingual text'
              assert 'assets/css/style.css' in s, f'{name}: missing shared stylesheet'
              assert 'assets/js/app.js' in s, f'{name}: missing shared language script'
              if name != 'index.html':
                  assert 'data-lang-toggle' in s, f'{name}: missing language toggle'
              if name.startswith('class09/ch') and name.endswith('.html'):
                  has_study_copy = 'id="study-copy"' in s and 'Study &amp; Copy' in s
                  has_legacy_study_section = 'id="notes"' in s
                  assert has_study_copy or has_legacy_study_section, f'{name}: missing Study & Copy section'
                  assert ('Questions &amp; Answers' in s or 'Questions and Answers' in s or 'questions-answers' in s or 'Check your understanding' in s), f'{name}: missing question-answer content'
                  assert not re.search(r'\bexam(?:[- ]?(?:ready|notes|practice|tip))?\b', s, re.I), f'{name}: exam-focused wording should not appear in student pages'
              print('OK', name)
          PY
      - name: Validate Class IX local links, anchors and unique IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  for key in ('href','src'):
                      if attrs.get(key): self.refs.append(attrs[key])
          pages={}
          for path in Path('class09').glob('*.html'):
              page=Page(); page.feed(path.read_text(encoding='utf-8'))
              duplicates=sorted({item for item in page.ids if page.ids.count(item)>1})
              assert not duplicates, f'{path}: duplicate IDs: {duplicates}'
              pages[path.resolve()]=page
          errors=[]
          for source,page in pages.items():
              for ref in page.refs:
                  url=urlsplit(ref)
                  if url.scheme or url.netloc or not url.path: continue
                  target=(source.parent/unquote(url.path)).resolve()
                  if not target.exists():
                      errors.append(f'{source}: missing local target {ref}'); continue
                  if url.fragment and target.suffix.lower()=='.html':
                      target_page=pages.get(target)
                      if target_page is None:
                          target_page=Page(); target_page.feed(target.read_text(encoding='utf-8'))
                      if unquote(url.fragment) not in target_page.ids:
                          errors.append(f'{source}: missing fragment {ref}')
          assert not errors, '\n'.join(errors)
          print(f'Validated {len(pages)} Class IX HTML files: local links, anchors and IDs are sound.')
          PY
      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check inline JavaScript in Class IX lessons
        run: |
          python - <<'PYINLINE'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.current=None; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      attrs=dict(attrs)
                      self.current=None if 'src' in attrs else []
              def handle_data(self, data):
                  if self.current is not None: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.current is not None:
                      code=''.join(self.current).strip()
                      if code: self.scripts.append(code)
                      self.current=None
          checked=0
          with tempfile.TemporaryDirectory() as tmp:
              for page in Path('class09').glob('*.html'):
                  parser=Scripts(); parser.feed(page.read_text(encoding='utf-8'))
                  for i, code in enumerate(parser.scripts):
                      path=Path(tmp)/f'{page.stem}-{i}.js'
                      path.write_text(code, encoding='utf-8')
                      subprocess.run(['node','--check',str(path)],check=True)
                      checked += 1
          print(f'Validated {checked} inline scripts across Class IX pages.')
          PYINLINE
      - name: Validate Class IX model-answer language parity
        run: |
          python - <<'PYLANG'
          from pathlib import Path
          import re
          pages = [
              'class09/ch01_part1_ict_basics.html',
              'class09/ch01_part2_computer_workflow.html',
              'class09/ch01_part3_inside_computer.html',
              'class09/ch01_part4_ict_practical_lab.html',
              'class09/ch02_textual_communication.html',
              'class09/ch03_visual_communication.html',
              'class09/ch04_audio_video_communication.html',
              'class09/ch05_presenting_ideas.html',
              'class09/ch06_getting_connected_internet.html',
              'class09/ch07_cyber_safety.html',
              'class09/ch08_fun_with_logic.html',
          ]
          total = 0
          for name in pages:
              html = Path(name).read_text(encoding='utf-8')
              answers = re.findall(r'<div class="model-answer">([\s\S]*?)</div>', html)
              assert len(answers) == 5, f'{name}: expected 5 model answers, found {len(answers)}'
              missing = [i + 1 for i, answer in enumerate(answers) if 'lang-hi' not in answer and 'lang="hi"' not in answer]
              assert not missing, f'{name}: model answers missing Hindi: {missing}'
              total += len(answers)
          print(f'Validated Hindi equivalents for all {total} model answers across {len(pages)} Class IX lessons.')
          PYLANG
      - name: Validate interactive story mount points
        run: |
          python - <<'PYHOOKS'
          from pathlib import Path
          from html.parser import HTMLParser
          class Hooks(HTMLParser):
              def __init__(self):
                  super().__init__(); self.data=set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key.startswith('data-'): self.data.add(key)
          expected = {
              'class09/ch01_part1_ict_basics.html': {'data-ict-story','data-ict-count','data-ict-options','data-ict-next'},
              'class09/ch06_getting_connected_internet.html': {'data-internet-journey','data-ij-count','data-ij-next','data-ij-options'},
              'class09/ch08_fun_with_logic.html': {'data-logic-mission','data-lm-count','data-lm-options','data-lm-next','data-lt-run','data-lt-download','data-lt-print'},
          }
          for name, required in expected.items():
              parser=Hooks(); parser.feed(Path(name).read_text(encoding='utf-8'))
              missing=sorted(required-parser.data)
              assert not missing, f'{name}: missing interactive hooks: {missing}'
              print('OK', name)
          PYHOOKS
      - uses: actions/configure-pages@v5
      - name: Download official Bihar Gazette PDF for offline hosting
        run: |
          mkdir -p assets/docs
          curl --fail --location --retry 3 --retry-delay 2 https://egazette.bihar.gov.in/GazettePrinting/GazettePublished/274_2_2024.pdf --output assets/docs/bihar-gazette-notification-786-gazette-274-2024.pdf
          test "$(head -c 5 assets/docs/bihar-gazette-notification-786-gazette-274-2024.pdf)" = "%PDF-"
          test "$(stat -c%s assets/docs/bihar-gazette-notification-786-gazette-274-2024.pdf)" -gt 10000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
