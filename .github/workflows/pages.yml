name: Validate and publish learning website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate student pages
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          for f in class08/index.html class09/index.html class10/index.html class11/index.html class12/index.html class09/ch01_introduction_ict.html class09/ch02_textual_communication.html class09/ch03_visual_communication.html class09/ch04_audio_video_communication.html class09/ch05_presenting_ideas.html class09/ch06_getting_connected_internet.html class09/ch07_cyber_safety.html class09/ch08_fun_with_logic.html class10/ch01_networks_web.html class11/ch01_number_systems.html class12/ch01_python_functions.html; do test -s "$f" || exit 1; done
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [
              'index.html',
              'class08/index.html',
              'class09/index.html',
              'class09/ch01_introduction_ict.html',
              'class09/ch02_textual_communication.html',
              'class09/ch03_visual_communication.html',
              'class09/ch04_audio_video_communication.html',
              'class09/ch05_presenting_ideas.html',
              'class09/ch06_getting_connected_internet.html',
              'class09/ch07_cyber_safety.html',
              'class09/ch08_fun_with_logic.html',
              'class10/index.html',
              'class10/ch01_networks_web.html',
              'class11/index.html',
              'class11/ch01_number_systems.html',
              'class12/index.html',
              'class12/ch01_python_functions.html',
          ]
          for name in pages:
              s = Path(name).read_text(encoding='utf-8')
              assert '<!doctype html>' in s.lower(), f'{name}: missing doctype'
              if name == 'index.html' or name.startswith('class08/') or name.startswith('class09/'):
                  assert 'lang-hi' in s, f'{name}: missing bilingual text'
              assert 'assets/css/style.css' in s, f'{name}: missing shared stylesheet'
              assert 'assets/js/app.js' in s, f'{name}: missing shared language script'
              if name != 'index.html':
                  assert 'data-lang-toggle' in s, f'{name}: missing language toggle'
              if name.startswith('class09/ch') and name.endswith('.html'):
                  assert 'id="notes"' in s, f'{name}: missing Notes section'
                  assert ('Questions &amp; Answers' in s or 'Questions and Answers' in s or 'questions-answers' in s or 'Check your understanding' in s), f'{name}: missing question-answer content'
                  assert 'Study &amp; Copy' not in s and 'Exam Notes' not in s, f'{name}: contains unwanted exam-note labels'
                  assert not re.search(r'\\bexam(?:[- ]?(?:ready|notes|practice|tip))?\\b', s, re.I), f'{name}: exam-focused wording should not appear in student pages'
              print('OK', name)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
